name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  build:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-build-maven.yml@main
    secrets: inherit

  matrix:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-build-matrix.yml@main
    with:
      build-tool: maven
    secrets: inherit

  owasp:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-owasp-check.yml@main
    with:
      build-tool: maven
    secrets: inherit

  sbom:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-sbom.yml@main
    with:
      build-tool: maven
    secrets: inherit

  # ADR-052, regla 2: el meta-starter trae cada starter que este BOM gestiona, en la misma versión.
  meta-completeness:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/check-meta-completeness.yml
